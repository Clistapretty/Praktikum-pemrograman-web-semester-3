    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>10 - Galeri Gambar - Sebelum</title>

    <style>
        /* 1. Gallery menjadi CSS Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* 2. Kotak gambar */
        .img-box {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
        }

        /* 3. Gambar memenuhi kotak */
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            /* 4. Hitam putih secara default */
            filter: grayscale(100%);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        /* 5. Efek hover */
        .img-box img:hover {
            filter: grayscale(0);
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <!-- Galeri 6 Gambar -->
    <div class="gallery">

        <div class="img-box">
            <img 
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500" 
                alt="Pemandangan Alam">
        </div>

        <div class="img-box">
            <img 
                src="https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=500" 
                alt="Gunung">
        </div>

        <div class="img-box">
            <img 
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" 
                alt="Pantai">
        </div>

        <div class="img-box">
            <img 
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" 
                alt="Danau">
        </div>

        <div class="img-box">
            <img 
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" 
                alt="Hutan">
        </div>

        <div class="img-box">
            <img 
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500" 
                alt="Pegunungan">
        </div>

    </div>

</body>
</html>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Ubah class ".gallery" menjadi CSS Grid (grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))) dan beri gap.
    2. Pada elemen pembungkus gambar (.img-box), berikan properti aspect-ratio: 1/1 (agar selalu kotak), overflow: hidden, dan border-radius.
    3. Pada <img>, atur width: 100%, height: 100%, object-fit: cover agar gambar memenuhi kotak tanpa distorsi.
    4. Tambahkan filter: grayscale(100%) pada gambar agar berwarna hitam putih secara default, dan tambahkan efek transition.
    5. Saat di hover (img:hover), ubah filter menjadi grayscale(0) dan gunakan transform: scale(1.1) agar gambar membesar sedikit saat ditunjuk.
    -->
