<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>04 - Kartu Produk - Sebelum</title>
</head>
<body>
   <style>
    /* Membuat kartu berada di tengah */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
    }

    /* 1. Kartu Produk */
    .product-card {
        width: 280px;
        border: 1px solid #ddd;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        background-color: white;
    }

    .product-card img {
        max-width: 100%;
        display: block;
    }

    .product-info {
        padding: 20px;
    }

    .product-info h3 {
        margin-top: 0;
    }

    .price {
        color: #e55ebc;
        font-size: 22px;
        font-weight: bold;
    }

    .buy-button {
        width: 100%;
        background-color: #e55ebc;
        color: white;
        border: none;
        padding: 12px;
        cursor: pointer;
        border-radius: 6px;
    }

    .buy-button:hover {
        background-color: #e55ebc;
    }
</style>

<div class="product-card">
    
    <img src="Heels Cantik.jpg" alt="Heels Cantik">

    <div class="product-info">
        <h3>Heels cantik</h3>

        <p>
            Heels cantik yang nyaman untuk digunakan sehari-hari.
        </p>

        <span class="price">Rp 500.000</span>

        <button class="buy-button">Beli Sekarang</button>
    </div>
</div>
