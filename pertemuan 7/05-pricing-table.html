<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>05 - Pricing Table - Sebelum</title>
</head>
<body>
    <style>
    /* Container untuk 3 paket */
    .pricing-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        min-height: 100vh;
        background-color: #f5f5f5;
    }

    /* Gaya dasar setiap kartu */
    .plan {
        width: 250px;
        padding: 25px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background-color: white;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Paket yang paling populer */
    .plan.popular {
        transform: scale(1.05);
        border: 2px solid #e55ebc;
    }

    /* Header paket popular */
    .popular h2 {
        color: #e55ebc;
    }

    /* Menghilangkan bullet pada daftar */
    .plan ul {
        list-style: none;
        padding: 0;
        margin: 20px 0;
    }

    .plan li {
        margin: 10px 0;
    }

    /* Harga */
    .price {
        font-size: 24px;
        font-weight: bold;
        color: #333;
    }

    /* Tombol */
    .plan button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background-color: #e55ebc;
        color: white;
        cursor: pointer;
    }

    .plan button:hover {
        background-color: #e55ebc;
    }
</style>

<div class="pricing-container">

    <!-- Cookies Premium -->
    <div class="plan">
        <h2>Cookies Premium</h2>
        <p class="price">Rp 50.000</p>

        <ul>
            <li>Enak</li>
            <li>Chewy</li>
         <li>Rasa Coklat</li>
        </ul>

        <button>Pilih Paket</button>
    </div>

    <!-- Cheesecake -->
    <div class="plan popular">
        <h2> Cheesecake </h2>
        <p class="price">Rp 100.000</p>

        <ul>
            <li>Lembut</li>
            <li>Ngeju Banget</li>
            <li>Manis</li>
        </ul>

        <button>Pilih Paket</button>
    </div>

    <!-- Crookie -->
    <div class="plan">
        <h2>Crookie</h2>
        <p class="price">Rp 150.000</p>

        <ul>
            <li>Renyah di luar</li>
            <li>Lumer di dalam</li>
            <li>Wangi</li>
        </ul>

        <button>Pilih Paket</button>
    </div>

</div>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Gunakan CSS Grid atau Flexbox pada ".pricing-container" untuk menyejajarkan 3 paket secara horizontal.
    2. Berikan gaya dasar pada setiap kartu ".plan" (border, padding, border-radius, background putih, text-align center).
    3. Khusus untuk paket tengah (berikan class .popular), ubah ukuran agar sedikit lebih menonjol (transform: scale(1.05) atau padding lebih besar).
    4. Ubah warna border/header pada paket popular untuk membedakannya.
    5. Hilangkan bullet pada daftar fitur (ul) dan berikan jarak.
    -->
