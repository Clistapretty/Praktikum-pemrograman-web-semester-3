    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>10 - Galeri Gambar - Sebelum</title>

    <style>
        /* 1. Gallery menjadi CSS Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* 2. Kotak gambar */
        .img-box {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
        }

        /* 3. Gambar memenuhi kotak */
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            /* 4. Hitam putih secara default */
            filter: grayscale(100%);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        /* 5. Efek hover */
        .img-box img:hover {
            filter: grayscale(0);
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <!-- Galeri 6 Gambar -->
    <div class="gallery">

        <div class="img-box">
            <img 
                src="kue maroon.jpg" 
                alt="Kue Macaron">
        </div>

        <div class="img-box">
            <img 
                src="25aa6d1a0f5b6d0d34e09ddfe69424b5.jpg" 
                alt="Kue Long Slice">
        </div>

        <div class="img-box">
            <img 
                src="93820545152c8b5a4ebf38f0116f3212.jpg"

        </div>

        <div class="img-box">

        <div class="img-box">

        </div>

        <div class="img-box">
            <img 
                src="18500b150654ac370ec46e13ccff9456.jpg"  
                alt="Kue Eclair"> 
        </div> 
 
    </div> 
 
</body>
